services:
  bilibili-mcp:
    container_name: bilibili
    build: .
    expose:
      - "8888"
    environment:
      BILI_MCP_TOKEN: ${BILI_MCP_TOKEN:?Set BILI_MCP_TOKEN in .env}
      BILI_ASR_MODEL: ${BILI_ASR_MODEL:-small}
      PORT: "8888"
    volumes:
      - bili-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    init: true
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    restart: unless-stopped
volumes:
  bili-data:
