[project]
name = "bilibili-mcp-server"
version = "0.2.0"
description = "Standalone single-owner Bilibili MCP over Streamable HTTP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "bilibili-api-python>=17.4.1,<18", "aiohttp>=3.12,<4", "qrcode[pil]>=8,<9", "faster-whisper>=1.2,<2", "yt-dlp>=2026.3.17", "uvicorn>=0.35,<1"]
[project.scripts]
bilibili-mcp = "bilibili_mcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/bilibili_mcp"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
